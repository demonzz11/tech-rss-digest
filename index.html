<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生活资讯</title><style>/* 手机优先：统一资讯、计划与反馈页的视觉层级和触控尺寸。 */
:root{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#25352f;background:#f5f6f2;line-height:1.7;font-size:16px;--accent:#246b55;--muted:#64736c;--border:#e3e8e1}
